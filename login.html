<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - AR Ecológico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-publica>
  <main class="pagina-login">
    <section class="secao login">
      <svg class="ilustracao" viewBox="0 0 160 90" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <rect x="10" y="8" width="140" height="38" rx="10" fill="currentColor" fill-opacity="0.1"/>
        <path d="M26 36h108"/>
        <circle cx="132" cy="22" r="3" fill="currentColor"/>
        <path d="M40 58c8 6 8 12 0 18M80 58c8 6 8 12 0 18M120 58c8 6 8 12 0 18"/>
      </svg>
      <h1>AR Ecológico</h1>
      <p class="subtitulo">Entre para acessar o sistema de gestão.</p>
      <form id="formularioLogin">
        <label>E-mail<input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
        <p id="mensagemLogin" class="erro" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
      <p id="dicaTeste" class="dica">Usuário de teste: <b>admin@arecologico.com</b><br>Senha: <b>123456</b></p>
    </section>
  </main>
  <script src="script/config.js"></script>
  <script src="script/autenticacao.js"></script>
</body>
</html>
